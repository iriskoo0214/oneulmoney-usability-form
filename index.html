<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>오늘머니 사용성 테스트</title>
<meta name="description" content="오늘머니 사용성 테스트 참가자 응답지" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <img src="assets/logo.svg" alt="오늘머니" class="logo" />
    <span class="top__title">사용성 테스트</span>
    <span class="top__count" id="count"></span>
  </header>
  <div class="progress" aria-hidden="true"><div class="progress__bar" id="bar"></div></div>

  <main class="wrap">
    <form id="form" novalidate>
      <div id="step"></div>
      <p class="error" id="error" role="alert"></p>
      <div class="nav">
        <button type="button" class="btn btn--ghost" id="prev">이전</button>
        <button type="submit" class="btn btn--primary" id="next">다음</button>
      </div>
    </form>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
